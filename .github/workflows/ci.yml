

name: CI                          

on: push                         

jobs:
  frontend:                      
    runs-on: ubuntu-latest        
    defaults:
      run:
        working-directory: frontend   
    steps:                        
      - uses: actions/checkout@v5          
      - uses: actions/setup-node@v5       
        with:
          node-version: 24
      - run: npm ci                
      - run: npm run lint                
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t rag-backend .